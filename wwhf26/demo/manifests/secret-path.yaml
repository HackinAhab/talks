# bhk-demo-2: External -> NodePort Service -> Pod -> ServiceAccount -> synthetic Secret
# The workload uses its ServiceAccount's narrowly scoped RBAC permission.
apiVersion: v1
kind: Namespace
metadata:
  name: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
---
apiVersion: v1
kind: Secret
metadata:
  name: synthetic-api-credential
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
type: Opaque
stringData:
  token: not-a-real-credential
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: public-web
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-synthetic-secret
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["synthetic-api-credential"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: public-web-reads-synthetic-secret
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
subjects:
  - kind: ServiceAccount
    name: public-web
    namespace: bhk-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-synthetic-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public-web
  template:
    metadata:
      labels:
        app: public-web
        app.kubernetes.io/part-of: bloodhound-kube-demo
    spec:
      serviceAccountName: public-web
      containers:
        - name: web
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: public-web
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
spec:
  type: NodePort
  selector:
    app: public-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
