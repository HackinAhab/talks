# bhk-demo: External -> NodePort Service -> privileged Pod -> kind Node
# The privileged container and kubelet hostPath produce node-impact edges.
apiVersion: v1
kind: Namespace
metadata:
  name: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-web
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: public-web
  template:
    metadata:
      labels:
        app: public-web
        app.kubernetes.io/part-of: bloodhound-kube-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27.5-alpine
          ports:
            - containerPort: 80
          securityContext:
            # Intentional: creates the BHK_CE_PRIV_MOUNT edge in this lab.
            privileged: true
          volumeMounts:
            - name: kubelet
              mountPath: /host-kubelet
              readOnly: true
      volumes:
        - name: kubelet
          hostPath:
            # Intentional: creates the BHK_mountedKubelet edge.
            path: /var/lib/kubelet
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: public-web
  namespace: bhk-demo
  labels:
    app.kubernetes.io/part-of: bloodhound-kube-demo
spec:
  type: NodePort
  selector:
    app: public-web
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
