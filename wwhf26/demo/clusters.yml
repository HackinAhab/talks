# Run from demo/: bloodhound-kube collect --clusters-config clusters.yml
# scripts/demo.sh up and collect export a minified kubeconfig for each cluster.
defaults:
  scope: core
  allNamespaces: true
  redacted: false
  concurrency: 10
  paginateLimit: 100
  clusterType: kubernetes
  outputDir: ./output

clusters:
  - name: bhk-demo
    kubeconfig: ./output/bhk-demo.kubeconfig
    outputFile: ./output/bhk-demo.jsonl
  - name: bhk-demo-2
    kubeconfig: ./output/bhk-demo-2.kubeconfig
    outputFile: ./output/bhk-demo-2.jsonl
