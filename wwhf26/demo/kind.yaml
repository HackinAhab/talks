kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
      # Keep the NodePort local to the lab host while making the demo service reachable.
      - containerPort: 30080
        hostPort: 8081
        listenAddress: "127.0.0.1"
        protocol: TCP
